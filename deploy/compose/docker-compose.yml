# Profile C: SOCKS (+ optional L3 on bridge; для LAN default-GW см. docker-compose.host.yml)
#
# Быстрый старт (из корня репозитория):
#   ./install.sh 'ss://...'
#
# Сеть: явный IPAM (не default-address-pools). Согласовано с типичным daemon.json:
#   bip/fixed-cidr  = 192.168.100.0/24   (docker0)
#   default-address-pools = 192.168.101.0/24  (прочие auto-сети)
#   outline-gate_net      = 192.168.102.0/24  (эта сеть, вне пула)
# Переопределение: COMPOSE_SUBNET / COMPOSE_GATEWAY в .env

name: outline-gate

services:
  outline-gate:
    image: ${IMAGE_TAG:-outline-gate:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: outline-gate
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      - default
    env_file:
      - path: .env
        required: false
    environment:
      # Ключ: из .env (OUTLINE_ACCESS_KEY) или из смонтированного файла
      OUTLINE_ACCESS_KEY: ${OUTLINE_ACCESS_KEY:-}
      OUTLINE_ACCESS_KEY_FILE: ${OUTLINE_ACCESS_KEY_FILE:-/run/secrets/outline_key}
      ROUTING_MODE: ${ROUTING_MODE:-exclude}
      BYPASS_CIDRS: ${BYPASS_CIDRS:-}
      BYPASS_CIDRS_FILE: ${BYPASS_CIDRS_FILE:-/config/bypass.txt}
      TUNNEL_CIDRS: ${TUNNEL_CIDRS:-}
      TUNNEL_CIDRS_FILE: ${TUNNEL_CIDRS_FILE:-/config/tunnel.txt}
      DIRECT_POLICY: ${DIRECT_POLICY:-direct}
      GATEWAY_ENABLE: ${GATEWAY_ENABLE:-false}
      LAN_INTERFACE: ${LAN_INTERFACE:-}
      SOCKS_LISTEN: ${SOCKS_LISTEN:-0.0.0.0:1080}
      HEALTH_LISTEN: ${HEALTH_LISTEN:-0.0.0.0:8080}
      TRANSPROXY_LISTEN: ${TRANSPROXY_LISTEN:-127.0.0.1:12345}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      RECONNECT_BASE_DELAY: ${RECONNECT_BASE_DELAY:-1s}
      RECONNECT_MAX_DELAY: ${RECONNECT_MAX_DELAY:-60s}
      DNS_MODE: ${DNS_MODE:-system}
      DNS_SERVERS: ${DNS_SERVERS:-}
      # Web UI для списка исключений (bypass). Требует UI_TOKEN.
      UI_ENABLE: ${UI_ENABLE:-false}
      UI_TOKEN: ${UI_TOKEN:-}
      BYPASS_RULES_FILE: ${BYPASS_RULES_FILE:-/config/bypass.rules.txt}
      BYPASS_DNS_REFRESH: ${BYPASS_DNS_REFRESH:-60s}
      OUTLINE_KEY_PERSIST_FILE: ${OUTLINE_KEY_PERSIST_FILE:-/config/outline_key.runtime.txt}
      # Prometheus text exposition on HEALTH_LISTEN (/metrics). Off by default.
      METRICS_ENABLE: ${METRICS_ENABLE:-false}
      # Optional SOCKS source allowlist (CSV / file). Empty = accept all.
      SOCKS_ALLOW_CIDRS: ${SOCKS_ALLOW_CIDRS:-}
      SOCKS_ALLOW_CIDRS_FILE: ${SOCKS_ALLOW_CIDRS_FILE:-}
    volumes:
      # rw: UI/API пишет bypass.rules.txt; static CIDR-файлы тоже здесь
      - ./config:/config
      # Опциональный файл ключа (создайте через configure.sh или вручную).
      # Если используете только OUTLINE_ACCESS_KEY в .env — файл может быть пустым-заглушкой.
      - ${OUTLINE_KEY_HOST_PATH:-./secrets/outline_key.txt}:/run/secrets/outline_key:ro
    ports:
      - "${HOST_SOCKS_PORT:-1080}:1080"
      - "${HOST_HEALTH_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# Явный IPAM: не расходует default-address-pools (на узких пулах /24 — критично).
# Не пересекается с bip 192.168.100.0/24 и auto-pool 192.168.101.0/24.
networks:
  default:
    name: outline-gate_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${COMPOSE_SUBNET:-192.168.102.0/24}
          gateway: ${COMPOSE_GATEWAY:-192.168.102.1}
