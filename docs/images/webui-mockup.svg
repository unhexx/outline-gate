<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="Web UI outline-gate">
  <rect width="720" height="520" rx="12" fill="#0f1419"/>
  <!-- browser chrome -->
  <rect x="24" y="24" width="672" height="472" rx="10" fill="#1a2332" stroke="#2a3548"/>
  <rect x="24" y="24" width="672" height="36" rx="10" fill="#121a24"/>
  <circle cx="48" cy="42" r="5" fill="#f07178"/>
  <circle cx="66" cy="42" r="5" fill="#e6c07b"/>
  <circle cx="84" cy="42" r="5" fill="#3dd68c"/>
  <rect x="120" y="32" width="400" height="20" rx="6" fill="#0f1419"/>
  <text x="132" y="46" fill="#8b9bb4" font-family="ui-monospace, monospace" font-size="10">http://192.168.1.10:28080/ui/</text>

  <text x="48" y="90" fill="#e7ecf3" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="650">outline-gate</text>
  <text x="48" y="110" fill="#8b9bb4" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Исключения VPN · ключ Outline · SOCKS + L3</text>

  <!-- token card -->
  <rect x="48" y="128" width="624" height="70" rx="8" fill="#121a24" stroke="#2a3548"/>
  <text x="64" y="150" fill="#8b9bb4" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Токен доступа (UI_TOKEN)</text>
  <rect x="64" y="158" width="400" height="26" rx="6" fill="#0f1419" stroke="#2a3548"/>
  <text x="76" y="176" fill="#5a6a82" font-family="ui-monospace, monospace" font-size="11">••••••••••••••••</text>
  <rect x="480" y="158" width="100" height="26" rx="6" fill="#3d8bfd"/>
  <text x="530" y="176" text-anchor="middle" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600">Сохранить</text>

  <!-- key card -->
  <rect x="48" y="214" width="624" height="100" rx="8" fill="#121a24" stroke="#2a3548"/>
  <text x="64" y="238" fill="#e7ecf3" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Ключ Outline</text>
  <text x="64" y="258" fill="#8b9bb4" font-family="Segoe UI, system-ui, sans-serif" font-size="10">ключ: ss://***@66.x.x.x:11098 · ready: да · server: 66.x.x.x</text>
  <rect x="64" y="270" width="480" height="28" rx="6" fill="#0f1419" stroke="#2a3548"/>
  <text x="76" y="288" fill="#5a6a82" font-family="ui-monospace, monospace" font-size="10">ss://…@host:port</text>
  <rect x="556" y="270" width="96" height="28" rx="6" fill="#3d8bfd"/>
  <text x="604" y="288" text-anchor="middle" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">Заменить</text>

  <!-- rules -->
  <rect x="48" y="330" width="624" height="140" rx="8" fill="#121a24" stroke="#2a3548"/>
  <text x="64" y="354" fill="#e7ecf3" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Bypass rules</text>
  <rect x="64" y="366" width="360" height="26" rx="6" fill="#0f1419" stroke="#2a3548"/>
  <text x="76" y="383" fill="#5a6a82" font-family="ui-monospace, monospace" font-size="10">*.example.com</text>
  <rect x="436" y="366" width="90" height="26" rx="6" fill="#3d8bfd"/>
  <text x="481" y="383" text-anchor="middle" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">Добавить</text>

  <text x="64" y="420" fill="#8b9bb4" font-family="ui-monospace, monospace" font-size="11">10.0.0.0/8          CIDR</text>
  <text x="64" y="442" fill="#8b9bb4" font-family="ui-monospace, monospace" font-size="11">example.com         домен</text>
  <text x="64" y="464" fill="#8b9bb4" font-family="ui-monospace, monospace" font-size="11">*.cdn.example.net   маска</text>
</svg>
